apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cmss-ingress
  namespace: cmss
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: cmss.example.com    # replace with real host and DNS
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cmss-service
                port:
                  number: 3000
