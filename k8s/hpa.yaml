apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cmss-hpa
  namespace: cmss
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cmss-deployment
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
