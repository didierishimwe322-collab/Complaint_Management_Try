name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# ✅ FIXED PERMISSIONS (THIS FIXES YOUR 403 ERROR)
permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (fetch all history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Determine registry and image name
        id: meta
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          REPO="${GITHUB_REPOSITORY}"      # owner/repo
          IMAGE_GHCR="ghcr.io/${REPO}:${TAG}"
          IMAGE_GHCR_LATEST="ghcr.io/${REPO}:latest"

          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            IMAGE_HUB="${{ secrets.DOCKERHUB_USERNAME }}/${GITHUB_REPOSITORY##*/}:${TAG}"
            IMAGE_HUB_LATEST="${{ secrets.DOCKERHUB_USERNAME }}/${GITHUB_REPOSITORY##*/}:latest"

            echo "registry=dockerhub" >> $GITHUB_OUTPUT
            echo "image=${IMAGE_HUB}" >> $GITHUB_OUTPUT
            echo "image_latest=${IMAGE_HUB_LATEST}" >> $GITHUB_OUTPUT
          else
            echo "registry=ghcr" >> $GITHUB_OUTPUT
            echo "image=${IMAGE_GHCR}" >> $GITHUB_OUTPUT
            echo "image_latest=${IMAGE_GHCR_LATEST}" >> $GITHUB_OUTPUT
          fi

          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Login to DockerHub
        if: steps.meta.outputs.registry == 'dockerhub'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR (fallback)
        if: steps.meta.outputs.registry == 'ghcr'
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.image_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: ✅ Create GitHub Release (FIXED)
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Release ${{ steps.meta.outputs.tag }}
          body: |
            ✅ Release ${{ steps.meta.outputs.tag }}

            🐳 Docker Image:
            ${{ steps.meta.outputs.image }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Output release info
        run: |
          echo "✅ Published Docker Images:"
          echo "${{ steps.meta.outputs.image }}"
          echo "${{ steps.meta.outputs.image_latest }}"
